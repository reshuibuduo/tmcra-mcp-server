[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tmcra-mcp-server"
version = "0.5.1"
description = "MCP server for explicit TMCRA long-term Agent memory operations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Yu Haoxin" },
]
keywords = [
  "agent-memory",
  "mcp",
  "model-context-protocol",
  "multi-agent",
  "tmcra",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.28.1,<2",
  "pydantic>=2.8,<3",
]

[project.urls]
Homepage = "https://tmcra.com"
Documentation = "https://github.com/reshuibuduo/tmcra-mcp-server#readme"
Repository = "https://github.com/reshuibuduo/tmcra-mcp-server"
Issues = "https://github.com/reshuibuduo/tmcra-mcp-server/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=7",
]

[project.scripts]
tmcra-mcp = "tmcra_mcp.server:main"
tmcra-mcp-smoke = "tmcra_mcp.server_smoke:main"
tmcra-mcp-setup = "tmcra_mcp.setup_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tmcra_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/README.zh-CN.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
